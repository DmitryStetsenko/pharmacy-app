name: Deploy Docs Site

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs-site/**'
      - 'docs/**'

permissions:
  contents: write

jobs:
  build-and-deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout 🛎️
        uses: actions/checkout@v4

      - name: Install and Build 🔧
        run: |
          cd docs-site
          npm ci
          npm run build

      - name: Deploy 🚀
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: docs-site/dist
          branch: gh-pages
          clean: true
